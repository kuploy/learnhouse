# Fork-only: build the LearnHouse docs site image and publish it to
# ghcr.io/kuploy/learnhouse-docs, for the `learnhouse-docs` stack component.
#
# Builds on PRs that touch docs/** (push: false) so the image is verified before
# merge, and builds + pushes on push to main.
#
# Logs in with the run's own GITHUB_TOKEN (permissions: packages: write). The
# ghcr package must also give this repository write access (Package settings →
# Manage Actions access).
name: Publish learnhouse-docs image (ghcr.io)

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - '.github/workflows/publish-docs-image.yaml'
  pull_request:
    paths:
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/kuploy/learnhouse-docs

jobs:
  publish:
    name: Build amd64 image + push on main
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image tags
        id: meta
        run: |
          SHA_SHORT=$(echo "${{ github.sha }}" | cut -c1-7)
          # Sanitize the ref: on PRs github.ref_name is "<n>/merge" and the "/"
          # is not a valid Docker tag char. PR builds aren't pushed; the tag just
          # has to be valid.
          BRANCH=$(echo "${{ github.ref_name }}" | tr '/' '-')
          echo "tags=${IMAGE}:${BRANCH},${IMAGE}:${BRANCH}-${SHA_SHORT}" >> $GITHUB_OUTPUT

      - name: Build and (on main) push
        uses: docker/build-push-action@v7
        with:
          context: ./docs
          file: ./docs/Dockerfile
          platforms: linux/amd64
          # PRs build-verify only; pushes/dispatch publish.
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
