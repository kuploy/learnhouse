# Fork-only: build the LearnHouse fat image (the app, carrying the
# live-classrooms code) and publish it to ghcr.io/kuploy/learnhouse-app,
# so kuploy can deploy it via the learnhouse-live template.
#
# NOTE: this builds the LearnHouse *app* image — NOT the LiveKit server (that's
# upstream livekit/livekit-server, deployed straight from the template).
#
# Separate from upstream's build-community.yaml (which pushes to
# ghcr.io/learnhouse/app) so upstream sync stays conflict-free.
#
# Logs in with the run's own GITHUB_TOKEN (permissions: packages: write). The
# ghcr package must also give this repository write access (Package settings →
# Manage Actions access).
name: Publish learnhouse-app image (ghcr.io)

on:
  push:
    branches:
      - main
    # Only rebuild when the image contents can actually change — keeps doc/CI
    # edits from triggering a full image build. Use workflow_dispatch to force one.
    paths:
      - 'apps/**'
      - 'Dockerfile'
      - 'docker/**'
  pull_request:
    # Build (without pushing) on PRs that touch the image, so Dockerfile changes
    # are verified before merge.
    paths:
      - 'apps/**'
      - 'Dockerfile'
      - 'docker/**'
  workflow_dispatch: # allow a manual build before/without a merge

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/kuploy/learnhouse-app

jobs:
  publish:
    name: Build amd64 image + push on main
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image tags
        id: meta
        run: |
          SHA_SHORT=$(echo "${{ github.sha }}" | cut -c1-7)
          # Docker tags can't contain '/', so flatten slashes from feature branch
          # / PR refs (e.g. fix/foo -> fix-foo) — dispatch + PR builds run on them.
          BRANCH=$(echo "${{ github.ref_name }}" | tr '/' '-')
          echo "tags=${IMAGE}:${BRANCH},${IMAGE}:${BRANCH}-${SHA_SHORT}" >> $GITHUB_OUTPUT

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          # amd64-only for a fast, reliable publish (target cluster is amd64).
          # Multi-arch via native arm64 runners is a follow-up.
          platforms: linux/amd64
          # Push on main/dispatch; PRs build only (verify, no publish).
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            LEARNHOUSE_PUBLIC=true
          cache-from: type=gha
          cache-to: type=gha,mode=max
